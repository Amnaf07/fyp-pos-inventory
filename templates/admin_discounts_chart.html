{% extends "base.html" %}
{% block title %}Admin - Discounts Over Time{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Discounts Over Time</h2>
  <canvas id="discountChart" height="100"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('discountChart').getContext('2d');
  const discountChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: {{ labels|safe }},
      datasets: [{
        label: 'Total Discounts',
        data: {{ values|safe }},
        borderColor: 'rgba(255, 99, 132, 1)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'top' },
        title: { display: true, text: 'Daily Discounts Given' }
      },
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
</script>
{% endblock %}
