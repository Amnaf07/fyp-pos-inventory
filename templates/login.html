 {% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="vh-100">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6 text-black">

        <div class="px-5 ms-xl-4">
          <span class="h1 fw-bold">
            <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo">
          </span>
        </div>

        <div class="d-flex align-items-center h-custom-2 px-5 ms-xl-4 mt-xl-n5">
          <form method="POST" action="{{ url_for('login') }}" style="width: 23rem;">
            <h3 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">Log in</h3>

            <div class="form-outline mb-4">
              <input type="text" name="username" placeholder="Username" class="form-control form-control-lg" required>
              <label class="form-label">Username</label>
            </div>

            <div class="form-outline mb-4">
              <input type="password" name="password" placeholder="Password" class="form-control form-control-lg" required>
              <label class="form-label">Password</label>
            </div>

            <div class="pt-1 mb-4">
              <button class="btn btn-info btn-lg btn-block" type="submit">Login</button>
            </div>

            <p class="small mb-5 pb-lg-2"><a class="text-muted" href="#!">Forgot password?</a></p>
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="link-info">Register here</a></p>
          </form>
        </div>

      </div>
      <div class="col-sm-6 px-0 d-none d-sm-block">
        <img src="{{ url_for('static', filename='img/loginimg.jpg') }}"
             alt="Login image" class="w-70 vh-70 mt-5 pl-3"
             style="object-fit: contain; object-position: left;">
      </div>
    </div>
  </div>
</section>
{% endblock %}
