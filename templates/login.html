{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="d-flex flex-column min-vh-100 bg-gradient">

  <!-- Theme Toggle at top-right -->
  <div class="text-end p-3">
  <button id="themeToggle" class="btn btn-sm btn-outline-secondary">
    ☀️
  </button>
</div>

  
  <!-- Main content fills available space -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="container">
      <div class="row justify-content-center">
        
        <!-- Centered Login Card -->
        <div class="col-md-6 bg-white p-5 shadow rounded">
          <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}" 
                 class="logo mb-3" 
                 style="max-height:170px;">
            <h3 class="fw-bold">Log in</h3>
          </div>

          <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" name="username" placeholder="Username" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" placeholder="Password" class="form-control" required>
            </div>

            <button class="btn btn-gradient w-100 mb-3" type="submit">Login</button>

            <div class="text-center">
              <p class="small"><a class="text-muted" href="#!">Forgot password?</a></p>
              <p class="small">
                Don't have an account? 
                <a href="{{ url_for('register') }}" class="link-gradient">Register here</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer always visible -->
  <footer class="text-center py-2">
    <small class="footer-text">© 2026 RetailSync. All rights reserved.</small>
  </footer>
</div>

<!-- Theme Toggle Script -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const toggle = document.getElementById("themeToggle");
    const body = document.body;

    // Load saved mode if exists
    if(localStorage.getItem("theme") === "dark") {
      body.classList.add("dark-mode");
      toggle.textContent = "🌙";
    } else {
      body.classList.add("light-mode");
      toggle.textContent = "☀️";
    }

    toggle.addEventListener("click", function() {
      body.classList.toggle("light-mode");
      body.classList.toggle("dark-mode");

      if(body.classList.contains("dark-mode")) {
        toggle.textContent = "🌙";
        localStorage.setItem("theme", "dark");
      } else {
        toggle.textContent = "☀️";
        localStorage.setItem("theme", "light");
      }
    });
  });
</script>

{% endblock %}
