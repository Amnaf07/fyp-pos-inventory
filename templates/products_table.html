<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="searchBar" class="form-control mb-3" placeholder="Search products...">

    <tbody id="productTable"> 
  {% for product in products %} 
  <tr {% if product.stock < 5 %}class="table-danger"{% endif %}>
    <td>{{ product.name }}</td> 
    <td>{{ product.barcode }}</td> 
    <td>{{ product.price }}</td> 
    <td>{{ product.stock }}</td> 
    <td>
      <button class="btn btn-sm btn-success add-to-cart"
              data-id="{{ product.id }}" 
              data-name="{{ product.name }}" 
              data-price="{{ product.price }}"
              {% if product.stock == 0 %}disabled{% endif %}>
        Add
      </button>
      <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#editModal{{ product.id }}">Edit</button>
      <button class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal{{ product.id }}">Delete</button>
    </td>
  </tr> 
  {% endfor %}
</tbody>


</body>
</html>
