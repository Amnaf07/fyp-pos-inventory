<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}POS System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <style>
   body { 
    padding-top: 56px; 
  } 

  .layout{
    display: flex;
    min-height: calc(100vh-56px);
  }

  .sidebar {
     width: 220px;              /* fixed width */
     background-color: #212529;
     color: #fff;
     padding: 1rem;
     justify-content: space-between;
     flex-direction: column;
     min-height: calc(100vh-56px);
     display: flex;
     flex-direction: column;
  }

  .main-content { 
    flex-grow: 1;
    padding: 1rem; } 

    @media (max-width: 768px) {
  .sidebar {
    position: fixed;
        top: 56px;
        left: 0;
        width: 250px;
        height: calc(100vh - 56px);
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 1050;
      }
  .sidebar.active { transform: translateX(0); }
  .main-content{
    flex-grow: 1;
  }
    }

    /* Active tab styling */
.sidebar .nav-link.active {
  background-color: #343a40; /* darker shade */
  font-weight: bold;
  border-radius: 4px;
}

/* Hover effect */
.sidebar .nav-link:hover {
  background-color: #495057; /* subtle lighter shade */
  border-radius: 4px;
  transition: background-color 0.2s ease;
}

.sidebar .nav {
  position: relative;
}

/* Indicator bar */
.sidebar .indicator {
  position: absolute;
  left: 0;
  width: 4px;
  background-color: #0d6efd; /* Bootstrap primary blue */
  border-radius: 2px;
  transition: top 0.3s ease, height 0.3s ease;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">POS And IMS</a>
      {% if session.get('user_id') %}
        <button class="btn btn-outline-light d-md-none me-2" id="sidebarToggle">
          <i class="bi bi-list"></i>
        </button>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
      {% endif %}
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      {% if session.get('user_id') %}
      <nav class="col-md-3 col-lg-2 sidebar text-white p-3">
        <h4 class="mb-4">Admin Panel</h4>
        <ul class="nav flex-column">
          <div class="indicator"></div>
          <li class="nav-item mb-2"><a class="nav-link text-white {% if request.endpoint == 'admin_dashboard' %}active{% endif %}"  href="{{ url_for('admin_dashboard') }}">
             <i class="bi bi-speedometer2"></i>
            Dashboard</a></li>

          <li class="nav-item mb-2">
          <a class="nav-link text-white {% if request.endpoint == 'manage_users' %}active{% endif %}" href="{{ url_for('manage_users') }}">
            <i class="bi bi-people"></i>
           Manage Users 
        </a>
      </li>
         
          <li class="nav-item mb-2"><a class="nav-link text-white {% if request.endpoint == 'products_table' %}active{% endif %}" href="{{ url_for('products_table') }}">
            
      <i class="bi bi-box-seam"></i>
            Products</a></li>
          <li class="nav-item mb-2"><a class="nav-link text-white {% if request.endpoint == 'sales_history_paginated' %}active{% endif %}" href="{{ url_for('sales_history_paginated') }}">
            <i class="bi bi-receipt"></i>
            Sales History</a></li>
          


          <li class="nav-item mb-2"><a class="nav-link text-white {% if request.endpoint == 'logout' %}active{% endif %}" href="{{ url_for('logout') }}">
            <i class="bi bi-box-arrow-right"></i>
            Logout</a></li>
        </ul>
      </nav>
      {% endif %}

      <!-- Main Content -->
      <main class="{% if session.get('user_id') %}col-md-9 col-lg-10{% else %}col-12{% endif %} px-4 main-content" id="content-area">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggleBtn = document.getElementById("sidebarToggle");
    const sidebar = document.querySelector(".sidebar");
    toggleBtn?.addEventListener("click", () => {
      sidebar.classList.toggle("active");
    });

  function moveIndicator() {
    const activeLink = document.querySelector(".sidebar .nav-link.active");
    const indicator = document.querySelector(".sidebar .indicator");
    if (activeLink && indicator) {
      const linkRect = activeLink.getBoundingClientRect();
      const navRect = activeLink.parentElement.parentElement.getBoundingClientRect();
      indicator.style.top = (linkRect.top - navRect.top) + "px";
      indicator.style.height = linkRect.height + "px";
    }
  }

  // Run on page load
  window.addEventListener("DOMContentLoaded", moveIndicator);

  // Run again when resizing
  window.addEventListener("resize", moveIndicator);

  // Optional: run when clicking links
  document.querySelectorAll(".sidebar .nav-link").forEach(link => {
    link.addEventListener("click", () => {
      document.querySelectorAll(".sidebar .nav-link").forEach(l => l.classList.remove("active"));
      link.classList.add("active");
      moveIndicator();
    });
  });

  </script>
</body>
</html>
