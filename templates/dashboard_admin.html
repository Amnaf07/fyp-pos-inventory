{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<div class="row mt-4 g-4">
  <!-- Total Sales -->
  <div class="col-12 col-sm-6 col-lg-4">
    <div class="card text-center shadow-sm border-0">
      <div class="card-body bg-primary text-white rounded">
        <i class="bi bi-currency-dollar fs-2 mb-2"></i>
        <h5 class="card-title">Total Sales</h5>
        <p class="card-text fs-4 mb-0">{{ total_sales }}</p>
      </div>
    </div>
  </div>

  <!-- Total Products -->
  <div class="col-12 col-sm-6 col-lg-4">
    <div class="card text-center shadow-sm border-0">
      <div class="card-body bg-success text-white rounded">
        <i class="bi bi-box-seam fs-2 mb-2"></i>
        <h5 class="card-title">Total Products</h5>
        <p class="card-text fs-4 mb-0">{{ total_products }}</p>
      </div>
    </div>
  </div>

  <!-- Low Stock Items -->
  <div class="col-12 col-sm-6 col-lg-4">
    <div class="card text-center shadow-sm border-0">
      <div class="card-body bg-danger text-white rounded">
        <i class="bi bi-exclamation-triangle fs-2 mb-2"></i>
        <h5 class="card-title">Low Stock Items</h5>
        <p class="card-text fs-4 mb-0">{{ low_stock }}</p>
      </div>
    </div>
  </div>
</div>

<div class="row mt-5">
  <div class="col-12">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Sales Trend</h5>
        {% if not sales_data %}
     <p class="text-muted">No sales data available yet.</p>
    {% endif %}
        <canvas id="salesChart" height="100"></canvas>
        <canvas id="financeChart" height="100"></canvas>
      </div>
    </div>
  </div>

</div>



<script id="chart-data" type="application/json">
  {
   "labels": {{ sales_labels|tojson|safe }},
  "sales": {{ sales_data|tojson|safe }},
  "expenses": {{ expenses_data|tojson|safe }},
  "profit": {{ profit_data|tojson|safe }}
  }
  
  
</script>
<script>

  const chartData = JSON.parse(document.getElementById('chart-data').textContent);
  const ctxFinance = document.getElementById('financeChart').getContext('2d');
  const financeChart = new Chart(ctxFinance, {
    type: 'line',
    data: {
      labels: chartData.labels,
      datasets: [
        {
          label: 'Sales',
          data: chartData.sales,
          borderColor: '#0d6efd',
          backgroundColor: 'rgba(13, 110, 253, 0.2)',
          tension: 0.3,
          pointBackgroundColor: 'white',
          pointBorderColor: '#0d6efd',
          pointRadius: 4,
          fill: true
        },
        {
          label: 'Expenses',
          data: chartData.expenses,
          borderColor: '#dc3545',
          backgroundColor: 'rgba(220, 53, 69, 0.2)',
          tension: 0.3,
          pointBackgroundColor: 'white',
          pointBorderColor: '#dc3545',
          pointRadius: 4,
          fill: true
        },
        {
          label: 'Profit',
          data: chartData.profit,
          borderColor: '#198754',
          backgroundColor: 'rgba(25, 135, 84, 0.2)',
          tension: 0.3,
          pointBackgroundColor: 'white',
          pointBorderColor: '#198754',
          pointRadius: 4,
          fill: true
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { boxWidth: 12 }
        },
        title: {
          display: true,
          text: 'Monthly Sales, Expenses & Profit',
          font: { size: 18 }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            callback: function(value) {
              return 'PKR ' + value.toLocaleString();
            }
          }
        }
      }
    }
  });

  
</script>



{% endblock %}
