{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}

{% block content %}
  <!-- KPI Cards -->
  <div class="row mt-4 g-4">
    <div class="col-md-4">
      <div class="card text-center bg-primary text-white shadow-sm">
        <div class="card-body">
          <i class="bi bi-currency-dollar fs-2"></i>
          <h5 class="card-title">Total Sales</h5>
          <p class="card-text fs-4">{{ total_sales }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center bg-success text-white shadow-sm">
        <div class="card-body">
          <i class="bi bi-box-seam fs-2"></i>
          <h5 class="card-title">Total Products</h5>
          <p class="card-text fs-4">{{ total_products }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center bg-danger text-white shadow-sm">
        <div class="card-body">
          <i class="bi bi-exclamation-triangle fs-2"></i>
          <h5 class="card-title">Low Stock Items</h5>
          <p class="card-text fs-4">{{ low_stock }}</p>
        </div>
      </div>
    </div>
  </div>

 
{% endblock %}
